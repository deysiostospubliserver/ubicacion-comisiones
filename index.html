<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Registro de Comisiones | Publiserver</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 30px 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      color: white;

      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.38),
          rgba(0, 0, 0, 0.62)
        ),
        url("imagenes/fondo-limpio-publiserver.png");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .contenedor {
      width: 100%;
      max-width: 520px;
      padding: 38px 32px;

      background: rgba(12, 18, 24, 0.84);

      backdrop-filter: blur(13px);
      -webkit-backdrop-filter: blur(13px);

      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 24px;

      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    /* Logo y título */

    .encabezado {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 28px;
    }

    .logo-contenedor {
      flex-shrink: 0;
      width: 145px;
      height: 105px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 10px;

      background: white;
      border-radius: 16px;

      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .logo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    h1 {
      margin: 0;

      text-align: left;
      font-size: 25px;
      line-height: 1.25;
      letter-spacing: 1px;
    }

    .descripcion {
      margin: 0 0 26px;

      color: rgba(255, 255, 255, 0.86);
      font-size: 16px;
      line-height: 1.6;
    }

    /* Botones */

    button {
      width: 100%;
      padding: 16px 24px;

      border: none;
      border-radius: 12px;

      color: white;
      font-size: 17px;
      font-weight: bold;

      cursor: pointer;

      background: linear-gradient(
        135deg,
        #168bd8,
        #075da3
      );

      box-shadow: 0 9px 22px rgba(0, 105, 180, 0.38);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        opacity 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 13px 28px rgba(0, 105, 180, 0.48);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
      transform: none;
    }

    #continuar {
      display: none;
      margin-top: 16px;

      background: linear-gradient(
        135deg,
        #28ad6e,
        #087747
      );

      box-shadow: 0 9px 22px rgba(0, 130, 75, 0.35);
    }

    /* Mensajes */

    #mensaje {
      min-height: 24px;
      margin: 22px 0 5px;

      font-size: 15px;
      line-height: 1.5;
    }

    .mensaje-buscando {
      color: #cae9ff;
    }

    .mensaje-exito {
      color: #8ff0bc;
    }

    .mensaje-error {
      color: #ffb0b0;
    }

    /* Pie */

    .pie {
      margin: 28px 0 0;

      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
    }

    /* Diseño para celulares */

    @media (max-width: 600px) {
      body {
        padding: 20px 15px;
        background-attachment: scroll;
      }

      .contenedor {
        padding: 30px 22px;
        border-radius: 20px;
      }

      .encabezado {
        flex-direction: column;
        gap: 16px;
      }

      .logo-contenedor {
        width: 155px;
        height: 105px;
      }

      h1 {
        text-align: center;
        font-size: 23px;
      }

      .descripcion {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <main class="contenedor">

    <div class="encabezado">

      <div class="logo-contenedor">
        <img
          src="imagenes/logo-publiserver.png"
          alt="Logo de Publiserver"
          class="logo"
        >
      </div>

      <h1>
        REGISTRO DE<br>
        COMISIONES
      </h1>

    </div>

    <p class="descripcion">
      Para continuar con el registro, permite el acceso
      a tu ubicación actual.
    </p>

    <button
      id="botonUbicacion"
      type="button"
      onclick="obtenerUbicacion()"
    >
      📍 Obtener ubicación
    </button>

    <p id="mensaje" aria-live="polite"></p>

    <button
      id="continuar"
      type="button"
      onclick="abrirFormulario()"
    >
      Continuar al formulario
    </button>

    <p class="pie">
      Publiserver · Arquitectura Publicitaria
    </p>

  </main>

  <script>
    const FORM_URL =
      "https://docs.google.com/forms/d/e/1FAIpQLSd8gUHX3IEWR_p7NSz4r-OXSmrioz6gG1Y5xkYPV3pWrNqlgA/viewform";

    const ENTRY_LOCALIZACION = "213315131";

    let enlaceFormulario = "";

    function mostrarMensaje(texto, clase = "") {
      const mensaje =
        document.getElementById("mensaje");

      mensaje.innerHTML = texto;
      mensaje.className = clase;
    }

    function obtenerUbicacion() {
      const botonUbicacion =
        document.getElementById("botonUbicacion");

      const botonContinuar =
        document.getElementById("continuar");

      enlaceFormulario = "";

      botonContinuar.style.display = "none";
      botonUbicacion.disabled = true;
      botonUbicacion.textContent =
        "📍 Obteniendo ubicación...";

      mostrarMensaje(
        "Buscando tu ubicación actual...",
        "mensaje-buscando"
      );

      if (!navigator.geolocation) {
        mostrarMensaje(
          "❌ Este dispositivo no permite obtener la ubicación.",
          "mensaje-error"
        );

        restaurarBoton();
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function (position) {
          const latitud =
            position.coords.latitude;

          const longitud =
            position.coords.longitude;

          const precision =
            Math.round(position.coords.accuracy);

          const enlaceMaps =
            "https://www.google.com/maps?q=" +
            latitud +
            "," +
            longitud;

          enlaceFormulario =
            FORM_URL +
            "?usp=pp_url" +
            "&entry." +
            ENTRY_LOCALIZACION +
            "=" +
            encodeURIComponent(enlaceMaps);

          mostrarMensaje(
            "✅ Ubicación obtenida correctamente.<br>" 
          );

          botonContinuar.style.display = "block";

          botonUbicacion.textContent =
            "📍 Actualizar ubicación";

          botonUbicacion.disabled = false;
        },

        function (error) {
          let textoError =
            "❌ Ocurrió un error al obtener tu ubicación.";

          if (error.code === 1) {
            textoError =
              "❌ Debes permitir el acceso a tu ubicación.";
          } else if (error.code === 2) {
            textoError =
              "❌ No se pudo determinar tu ubicación.";
          } else if (error.code === 3) {
            textoError =
              "❌ Se agotó el tiempo para obtener tu ubicación.";
          }

          mostrarMensaje(
            textoError,
            "mensaje-error"
          );

          restaurarBoton();
        },

        {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 0
        }
      );
    }

    function restaurarBoton() {
      const botonUbicacion =
        document.getElementById("botonUbicacion");

      botonUbicacion.disabled = false;
      botonUbicacion.textContent =
        "📍 Intentar nuevamente";
    }

    function abrirFormulario() {
      if (enlaceFormulario !== "") {
        window.location.href =
          enlaceFormulario;
      }
    }
  </script>

</body>
</html>
